<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final Mobile Kellner UI</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --soft: #f8f9fb;
      --soft-strong: #eef2f6;
      --primary: #b91c1c;
      --primary-strong: #7f1d1d;
      --primary-soft: #fee2e2;
      --text: #111827;
      --muted: #5f6b7a;
      --line: #e5e7eb;
      --success: #1f9d68;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    body {
      padding: 20px;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }

    .left-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .back-btn, .ghost-btn, .chip, .product-card, .qty-btn, .primary-btn {
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      cursor: pointer;
    }

    .back-btn {
      background: #fff;
      border: none;
      color: var(--primary-strong);
      font-weight: 700;
      padding: 8px 10px;
    }

    .table-pill {
      background: var(--primary-soft);
      color: var(--primary-strong);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .table-name {
      font-size: 1.05rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ghost-btn {
      background: white;
      padding: 10px 14px;
      font-weight: 700;
      color: var(--text);
    }

    .header-total {
      text-align: right;
      min-width: 120px;
    }

    .header-total small {
      color: var(--muted);
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-total strong {
      display: block;
      font-size: 1.2rem;
      margin-top: 2px;
    }

    .category-strip {
      overflow-x: auto;
      display: flex;
      gap: 8px;
      padding: 4px 2px 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .category-strip::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: var(--panel);
      color: var(--muted);
      border-color: var(--line);
      padding: 9px 13px;
      white-space: nowrap;
      font-weight: 700;
      font-size: 0.72rem;
    }

    .chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      box-shadow: 0 6px 16px rgba(185, 28, 28, 0.18);
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(260px, 0.9fr);
      gap: 16px;
    }

    .product-panel,
    .order-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 12px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .product-card {
      position: relative;
      background: var(--soft);
      min-height: 120px;
      text-align: left;
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-color: rgba(17, 24, 39, 0.06);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .product-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(17, 24, 39, 0.06);
    }

    .product-card .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      min-width: 1.6rem;
      height: 1.6rem;
      padding: 0 0.35rem;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.7);
      color: white;
      font-size: 0.68rem;
      line-height: 1.6rem;
      font-weight: 800;
      text-align: center;
    }

    .product-name {
      display: block;
      font-weight: 900;
      line-height: 1.1;
      margin-top: 4px;
      margin-right: 14px;
    }

    .product-name strong {
      display: block;
      font-size: clamp(1.05rem, 2vw, 1.55rem);
      line-height: 1;
      margin-bottom: 0.18rem;
    }

    .product-name span {
      display: block;
      font-size: 0.8rem;
      opacity: 0.9;
      line-height: 1.18;
    }

    .product-price {
      margin-top: 8px;
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary-strong);
    }

    .order-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-weight: 800;
    }

    .order-meta {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .order-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .item-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .item-text strong {
      font-size: 0.92rem;
      line-height: 1.2;
    }

    .item-text small {
      color: var(--muted);
      font-size: 0.7rem;
    }

    .item-price {
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--text);
    }

    .qty-btns {
      display: flex;
      gap: 4px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      background: var(--soft-strong);
      font-weight: 800;
      color: var(--text);
    }

    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 2px;
      font-weight: 800;
    }

    .primary-btn {
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%);
      color: white;
      border-color: var(--primary-strong);
      padding: 14px 16px;
      font-weight: 800;
      border-radius: 12px;
      margin-top: auto;
      box-shadow: 0 10px 18px rgba(127, 29, 29, 0.18);
    }

    @media (max-width: 820px) {
      body { padding: 12px; }
      .content { grid-template-columns: 1fr; }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { gap: 8px; }
      .header-total { min-width: 80px; }
    }

    @media (max-width: 420px) {
      .topbar {
        flex-wrap: wrap;
      }
      .product-grid {
        grid-template-columns: 1fr 1fr;
      }
      .product-card {
        min-height: 112px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="left-group">
        <button class="back-btn">← Tische</button>
        <span class="table-pill">Tisch</span>
        <span class="table-name">H-A1</span>
      </div>

      <button class="ghost-btn">Historie</button>

      <div class="header-total">
        <small>Gesamt</small>
        <strong>€ 18,40</strong>
      </div>
    </header>

    <nav class="category-strip" aria-label="Kategorien">
      <button class="chip active">Alle</button>
      <button class="chip">Bier</button>
      <button class="chip">Fleisch</button>
      <button class="chip">Softdrinks</button>
      <button class="chip">Wein</button>
      <button class="chip">Wasser</button>
      <button class="chip">Saft</button>
    </nav>

    <main class="content">
      <section class="product-panel">
        <div class="product-grid">
          <button class="product-card">
            <span class="badge">2x</span>
            <span class="product-name"><strong>Bier</strong><span>Krügerl 0.5L</span></span>
            <span class="product-price">€ 4,20</span>
          </button>

          <button class="product-card">
            <span class="badge">1x</span>
            <span class="product-name"><strong>Radler</strong><span>0.5L</span></span>
            <span class="product-price">€ 4,60</span>
          </button>

          <button class="product-card">
            <span class="badge">2x</span>
            <span class="product-name"><strong>Keltenbier</strong><span>0.33L</span></span>
            <span class="product-price">€ 4,10</span>
          </button>

          <button class="product-card">
            <span class="badge">1x</span>
            <span class="product-name"><strong>Cola</strong><span>0.33L</span></span>
            <span class="product-price">€ 3,80</span>
          </button>

          <button class="product-card">
            <span class="badge">1x</span>
            <span class="product-name"><strong>Almdudler</strong><span>0.33L</span></span>
            <span class="product-price">€ 3,60</span>
          </button>

          <button class="product-card">
            <span class="badge">1x</span>
            <span class="product-name"><strong>Mineralwasser</strong><span>1L</span></span>
            <span class="product-price">€ 2,90</span>
          </button>
        </div>
      </section>

      <aside class="order-panel">
        <div class="order-header">
          <span>Aktuelle Bestellung</span>
          <span class="order-meta">3 Positionen</span>
        </div>

        <div class="order-item">
          <div class="item-text">
            <strong>Bier Krügerl 0.5L</strong>
            <small>2x</small>
          </div>
          <div class="item-price">€ 8,40</div>
          <div class="qty-btns">
            <button class="qty-btn">−</button>
            <button class="qty-btn">+</button>
          </div>
        </div>

        <div class="order-item">
          <div class="item-text">
            <strong>Radler 0.5L</strong>
            <small>1x</small>
          </div>
          <div class="item-price">€ 4,60</div>
          <div class="qty-btns">
            <button class="qty-btn">−</button>
            <button class="qty-btn">+</button>
          </div>
        </div>

        <div class="order-item">
          <div class="item-text">
            <strong>Cola 0.33L</strong>
            <small>1x</small>
          </div>
          <div class="item-price">€ 3,80</div>
          <div class="qty-btns">
            <button class="qty-btn">−</button>
            <button class="qty-btn">+</button>
          </div>
        </div>

        <div class="summary">
          <span>Gesamt</span>
          <span>€ 18,40</span>
        </div>

        <button class="primary-btn">Bestellung senden</button>
      </aside>
    </main>
  </div>
</body>
</html>
